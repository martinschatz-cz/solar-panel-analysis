title: Solar Panel Analysis
copyright: '2025, Martin Schätz'
author: Martin Schätz

execute:
  execute_notebooks: "force"

html:
  use_edit_page_button : true
  use_repository_button: true
  baseurl              : https://martinschatz-cz.github.io/solar-panel-analysis

repository:
  url: https://github.com/martinschatz-cz/solar-panel-analysis
  branch: main

launch_buttons:
  binderhub_url: "https://mybinder.org"
  colab_url    : "https://colab.research.google.com"
  thebe        : true

latex:
  latex_documents:
    targetname: book.tex

parse:
  myst_enable_extensions:
    - html_image
    - dollarmath


bibtex_bibfiles:
  - bibliography.bib

sphinx:
  config:
    bibtex_reference_style: author_year
